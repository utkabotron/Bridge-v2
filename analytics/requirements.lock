# Exact versions, captured from the images that are running in production.
# requirements.txt keeps the direct dependencies and their intended ranges; this file is
# what actually gets installed, so a rebuild cannot quietly pick up a breaking release.
# redis-py 8.x is the cautionary tale: an unpinned `redis>=5.0.3` arrived as 8.1.0, whose
# blocking-command timeouts broke the consumer loop and filled the logs for weeks.
#
# Refresh deliberately, never as a side effect of a deploy:
#   docker compose exec <service> pip freeze > <service>/requirements.lock
