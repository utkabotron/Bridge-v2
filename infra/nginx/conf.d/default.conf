server {
    listen 80;
    server_name brdg.tools;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Rate limit zones. Without these, Basic Auth on the dashboard is brute-forceable at
# network speed, and /connect — which spawns a ~400 MB Chromium per call — is a one-line
# memory DoS on a 3.8 GB box.
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=connect:10m rate=5r/m;

server {
    listen 443 ssl;
    server_name brdg.tools;

    ssl_certificate     /etc/letsencrypt/live/brdg.tools/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brdg.tools/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # The Mini App runs in Telegram's WebView and is framed by web.telegram.org; everything
    # else is denied a frame so this origin can't be clickjacked into acting as the user.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://*.telegram.org" always;

    # /analyze-direct uploads documents; everything else here is small JSON.
    client_max_body_size 8m;

    # ── Processor dashboard (Basic Auth) ─────────────────────
    location /dashboard {
        auth_basic "Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd;
        limit_req zone=auth burst=20 nodelay;

        proxy_pass http://processor:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/stats {
        auth_basic "Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd;
        limit_req zone=auth burst=20 nodelay;

        proxy_pass http://processor:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/reports {
        auth_basic "Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd;
        limit_req zone=auth burst=20 nodelay;

        proxy_pass http://processor:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/costs {
        auth_basic "Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd;
        limit_req zone=auth burst=20 nodelay;

        proxy_pass http://processor:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/daily-stats {
        auth_basic "Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd;
        limit_req zone=auth burst=20 nodelay;

        proxy_pass http://processor:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/backlog {
        auth_basic "Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd;
        limit_req zone=auth burst=20 nodelay;

        proxy_pass http://processor:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/profiles {
        auth_basic "Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd;
        limit_req zone=auth burst=20 nodelay;

        proxy_pass http://processor:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /events {
        auth_basic "Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd;
        limit_req zone=auth burst=20 nodelay;

        proxy_pass http://processor:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # ── wa-service ───────────────────────────────────────────
    # Every route below authenticates itself (signed Telegram initData, the bot's shared
    # secret, or a one-time QR token) — see wa-service/src/middleware/tg-auth.js.

    # Spawning a WhatsApp client costs ~400 MB of Chromium, so this one is throttled hard.
    location /connect/ {
        limit_req zone=connect burst=3 nodelay;

        proxy_pass http://wa-service:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=general burst=30 nodelay;

        proxy_pass http://wa-service:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
