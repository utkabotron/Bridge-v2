
services:
  # ── Infrastructure ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Bind to loopback only. Redis has no auth; on a public-IP VPS an open 6379 lets anyone
    # FLUSHALL the whole pipeline. Containers reach it over the compose network by name.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    environment:
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: bridge
      POSTGRES_DB: bridge
      TZ: Asia/Jerusalem
      PGTZ: Asia/Jerusalem
    # Loopback only — the DB (weak bridge:bridge creds) must not be reachable from the
    # public internet. Services connect over the compose network via the `postgres` host.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    command: server /data --console-address ":9001"
    ports:
      # 9000 (S3 API) stays public — Telegram fetches media over presigned URLs. The
      # bucket itself is private (infra/minio-init.sh), so this port no longer serves
      # anyone without a signature.
      - "9000:9000"
      # Admin console is loopback only — no reason to expose it to the internet.
      - "127.0.0.1:9001:9001"
    environment:
      # No defaults on purpose: these are the S3 API's admin credentials on a public port.
      # The literals that used to sit here ("bridge"/"bridgeminio") handed anyone who read
      # the repo full control of the media store.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: /init.sh
    environment:
      - S3_BUCKET=${S3_BUCKET:-bridge-media}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - ./infra/minio-init.sh:/init.sh:ro

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    mem_limit: 128m
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - wa-service
      - processor

  # ── Application Services ──────────────────────────────────
  wa-service:
    build: ./wa-service
    restart: unless-stopped
    # Four Chromium instances at ~400 MB. The limit is the point where we would rather
    # lose this container than have the kernel choose a victim across the whole box.
    mem_limit: 2400m
    # Four browsers do not close in Docker's default 10s, and SIGKILL leaves SingletonLock
    # files behind that block the next start.
    stop_grace_period: 60s
    logging: *default-logging
    expose:
      - "3000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://83.217.222.126:9000}
      - S3_BUCKET=${S3_BUCKET:-bridge-media}
      - DATABASE_URL=${DATABASE_URL:-postgresql://bridge:bridge@postgres:5432/bridge}
      # Needed to verify Mini App initData signatures, and to authenticate the bot's
      # server-to-server calls. Without them every route here is anonymous.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      - PORT=3000
      - TZ=Asia/Jerusalem
      # environment is an explicit allow-list: anything not named here never reaches the
      # container, no matter what .env says. Both of these are operational knobs we need
      # to turn without rebuilding the image.
      - WA_WEB_VERSION=${WA_WEB_VERSION:-}
      - MAX_CONCURRENT_CLIENTS=${MAX_CONCURRENT_CLIENTS:-10}
    volumes:
      - wa_sessions:/app/.wwebjs_auth
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy

  processor:
    build: ./processor
    restart: unless-stopped
    mem_limit: 512m
    # The consumer drains for up to BRPOP_TIMEOUT + 30s; killing it sooner is what the
    # in-flight queue now covers, but let it finish cleanly when it can.
    stop_grace_period: 45s
    logging: *default-logging
    ports:
      # Loopback only — nginx reaches the dashboard/API over the compose network
      # (infra/nginx/conf.d/default.conf). A public 8000 only attracted scanners.
      - "127.0.0.1:8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=${DATABASE_URL:-postgresql://bridge:bridge@postgres:5432/bridge}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-bridge-v2}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TARGET_LANGUAGE=${TARGET_LANGUAGE:-Russian}
      - TRANSLATION_CACHE_TTL=${TRANSLATION_CACHE_TTL:-86400}
      - ADMIN_TG_IDS=${ADMIN_TG_IDS}
      - ADMIN_NO_PAIR_FALLBACK=${ADMIN_NO_PAIR_FALLBACK:-false}
      # Media reads are signed now that the bucket is private (src/s3.py).
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://83.217.222.126:9000}
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - TZ=Asia/Jerusalem
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  bot:
    build: ./bot
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    # No published port: the bot runs on polling and serves nothing over HTTP.
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=${DATABASE_URL:-postgresql://bridge:bridge@postgres:5432/bridge}
      - WA_SERVICE_URL=http://wa-service:3000
      - WA_SERVICE_PUBLIC_URL=${WA_SERVICE_PUBLIC_URL:-http://localhost:3000}
      - PROCESSOR_URL=http://processor:8000
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      - ADMIN_TG_IDS=${ADMIN_TG_IDS}
      - TZ=Asia/Jerusalem
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  analytics:
    build: ./analytics
    restart: unless-stopped
    mem_limit: 900m
    logging: *default-logging
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://bridge:bridge@postgres:5432/bridge}
      # Monitoring targets. These were absent, so the health flow silently fell back to
      # its defaults and watched nothing but its own assumptions.
      - WA_SERVICE_URL=http://wa-service:3000
      - PROCESSOR_URL=http://processor:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BIGQUERY_PROJECT=${BIGQUERY_PROJECT}
      - BIGQUERY_DATASET=${BIGQUERY_DATASET:-bridge_analytics}
      - PREFECT_API_URL=${PREFECT_API_URL}
      - PREFECT_API_KEY=${PREFECT_API_KEY}
      # Prefect's own metadata DB. On the default sqlite file the concurrent flows
      # collided ~100 times a day with "database is locked".
      - PREFECT_API_DATABASE_CONNECTION_URL=${PREFECT_API_DATABASE_CONNECTION_URL:-postgresql+asyncpg://bridge:bridge@postgres:5432/prefect}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADMIN_TG_IDS=${ADMIN_TG_IDS}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-sa.json
      - TZ=Asia/Jerusalem
    volumes:
      # Mount only if file exists locally — skip for local dev without BigQuery
      - ${GCP_SA_PATH:-/dev/null}:/app/gcp-sa.json:ro
      # Nightly pg_dump lands on the host, outside the Docker volume it backs up.
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  redis_data:
  postgres_data:
  wa_sessions:
  minio_data:
  certbot_webroot:
